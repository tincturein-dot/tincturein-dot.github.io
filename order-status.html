<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order status — Tincture</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0e0f0c;color:#e9e4d4;font-family:'IBM Plex Mono',monospace;text-align:center;padding:24px}
  .card{max-width:440px}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:34px;margin:0 0 16px}
  p{color:#9b9788;line-height:1.7;font-size:14px}
  a{display:inline-block;margin-top:28px;color:#8a9a64;text-transform:uppercase;
    letter-spacing:.12em;font-size:12px;border-bottom:1px solid #2c2d23;padding-bottom:4px}
  .muted{opacity:.6;font-size:12px;margin-top:20px}
</style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">checking your order…</h1>
    <p id="msg">one moment while we confirm payment.</p>
    <a href="index.html">return to tincture</a>
    <p class="muted" id="ref"></p>
  </div>
<script>
  const BACKEND = "https://tincture-backend.onrender.com";
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order_id");
  const title = document.getElementById("title");
  const msg = document.getElementById("msg");
  const ref = document.getElementById("ref");

  if(!orderId){
    title.textContent = "no order found";
    msg.textContent = "we couldn't find an order reference.";
  } else {
    ref.textContent = "ref: " + orderId;
    fetch(BACKEND + "/verify-payment/" + orderId)
      .then(r => r.json())
      .then(d => {
        if(d.paid){
          title.textContent = "payment received";
          msg.textContent = "thank you — your specimen is being prepared. we'll be in touch with shipping details.";
        } else {
          title.textContent = "payment not completed";
          msg.textContent = "we didn't receive payment for this order. if you were charged, message us on instagram and we'll sort it out.";
        }
      })
      .catch(() => {
        title.textContent = "couldn't confirm";
        msg.textContent = "we couldn't reach the server. if you completed payment, message us on instagram to confirm.";
      });
  }
</script>
</body>
</html>
